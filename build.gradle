buildscript {
    repositories {
        google()
        mavenCentral()
        maven { 
            url 'http://127.0.0.1:8899/google'
            allowInsecureProtocol = true
        }
        maven { 
            url 'http://127.0.0.1:8899/central'
            allowInsecureProtocol = true
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { 
            url 'http://127.0.0.1:8899/google'
            allowInsecureProtocol = true
        }
        maven { 
            url 'http://127.0.0.1:8899/central'
            allowInsecureProtocol = true
        }
    }
}
